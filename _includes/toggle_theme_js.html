<script>
  // Runs in <head> so the saved/OS theme is applied before first paint.
  // Order: saved choice > site.theme_config.appearance > OS prefers-color-scheme.
  (function () {
    var root = document.documentElement;
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    var configured = "{{ site.theme_config.appearance | default: 'auto' }}";
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}

    function resolve() {
      if (saved === 'dark' || saved === 'light') return saved;
      if (configured === 'dark' || configured === 'light') return configured;
      return media.matches ? 'dark' : 'light';
    }

    root.setAttribute('data-theme', resolve());

    // Follow OS changes until the visitor picks a theme themselves.
    media.addEventListener('change', function () {
      if (!saved) root.setAttribute('data-theme', resolve());
    });

    window.addEventListener('DOMContentLoaded', function () {
      var button = document.querySelector('.theme-toggle');
      if (!button) return;
      button.addEventListener('click', function (event) {
        event.stopPropagation();
        saved = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', saved);
        try { localStorage.setItem('theme', saved); } catch (e) {}
      });
    });
  })();
</script>
