title: Serena Elizabeth Alvarez ❀ 
subtitle: Data Scientist
author:
  name: Serena Alvarez
  twitter: dataserenaa
url: https://seerreenna.github.io # root address of the site
repository: seerreenna/seerreenna.github.io # lets jekyll-github-metadata build locally
baseurl: "" # user site, served from the domain root
description: > # description of the site (multiple lines allowed)
  Hi! I'm Serena, a Data Scientist based in Irvine, CA with over three years of experience in the tech industry. I enjoy piecing together small bits of information to gain a better perspective of the world at large. I hope to use my insights to engineer something that makes a meaningful change!

  Check out my projects below or my blog in the navigation bar above!  
permalink: /:slug

twitter:
    username: dataserenaa 
    card: summary_large_image

# Moonwalk theme (github.com/abhinavs/moonwalk) is vendored: every layout, include and
# SCSS file it needs lives in this repo, so no remote_theme fetch is needed.
# theme: null stops GitHub Pages from adding its default Primer theme.
theme: null


theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  appearance_toggle: true # if appearance can be switched by user
  back_home_text: "Back to Homepage" # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: true # show blog description
  show_navbar: true # show horizontal navbar
  show_footer: true # show footer links in home page,add in _data/home.yml
  show_copyright: true # show copyright notice in footer
  # following keys are using to create home layout
  show_projects: true # show projects as cards, add in _data/home.yml
  show_blog: true # show blog posts added in _posts
  show_old_projects: true
  show_reading_time: true # show number of words and reading time in the blog posts
  show_tags: false # show tags in a blog posts
  # options for "home" page
  home:
    title_projects: Data Analysis & Exploration
    title_old_projects: AI/ Machine Learning
    title_blog: Blog
    
collections:
  projects:
    output: true
    permalink: /projects/:path/

highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Default social preview image (used by jekyll-seo-tag for og:image / twitter:image)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/serena_pic.jpg

# Repo-only files that should not be published to the live site.
# (_data is still read by templates; it is just no longer copied into _site.)
exclude:
  - CLAUDE.md
  - README.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - bin/
  - "*.code-workspace"
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - node_modules/
